name: TrollStore CN Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
    - name: Checkout opa334/TrollStore + submodules
      uses: actions/checkout@v4
      with:
        repository: opa334/TrollStore
        submodules: 'recursive'

    - name: Install dependencies
      run: brew install openssl@3 libarchive pkg-config ldid || true

    - name: Setup Theos + SDK
      run: |
        export THEOS=~/theos
        if [ ! -d "$THEOS/bin" ]; then
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
        fi
        mkdir -p "$THEOS/sdks"
        curl -sL "https://github.com/theos/sdks/archive/master.zip" -o /tmp/sdks.zip
        unzip -qo /tmp/sdks.zip -d /tmp
        cp -rn /tmp/sdks-master/*.sdk "$THEOS/sdks/" 2>/dev/null || true
        rm -rf /tmp/sdks-master /tmp/sdks.zip
        if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
          XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)
          if [ -n "$XCODE_SDK" ] && [ -d "$XCODE_SDK" ]; then
            ln -sfn "$XCODE_SDK" "$THEOS/sdks/iPhoneOS16.5.sdk"
          fi
        fi
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV

    - name: Chinese Localization
      run: |
        sed -i '' -e 's|@"Apps"|@"应用"|g' -e 's|@"Settings"|@"设置"|g' TrollStore/TSRootViewController.m
        sed -i '' -e 's|@"Respring"|@"注销桌面"|g' -e 's|@"Cancel"|@"取消"|g' -e 's|@"Close"|@"关闭"|g' -e 's|@"Error"|@"错误"|g' TrollStore/TSSettingsListController.m TrollStore/TSAppTableViewController.m TrollStore/TSInstallationController.m
        sed -i '' -e 's|@"Reboot Now"|@"立即重启"|g' -e 's|@"Reboot Required"|@"需要重启"|g' TrollStore/TSSettingsListController.m TrollStore/TSInstallationController.m
        sed -i '' -e 's|@"Install"|@"安装"|g' -e 's|@"Open"|@"打开"|g' -e 's|@"Uninstall"|@"卸载"|g' -e 's|@"User"|@"用户"|g' -e 's|@"System"|@"系统"|g' TrollStore/TSAppTableViewController.m
        sed -i '' -e 's|@"Installing"|@"正在安装"|g' -e 's|@"Downloading"|@"正在下载"|g' -e 's|@"Warning"|@"警告"|g' TrollStore/TSInstallationController.m
        sed -i '' -e 's|@"Security"|@"安全"|g' -e 's|@"Utilities"|@"工具"|g' -e 's|@"Persistence"|@"持久化"|g' -e 's|@"Signing"|@"签名"|g' -e 's|@"Advanced"|@"高级"|g' -e 's|@"Donate"|@"捐赠"|g' TrollStore/TSSettingsListController.m
        sed -i '' -e 's|@"Developer Mode"|@"开发者模式"|g' -e 's|@"Update Available"|@"有更新可用"|g' TrollStore/TSSettingsListController.m
        sed -i '' -e 's|@"Refresh App Registrations"|@"刷新应用注册"|g' -e 's|@"Rebuild Icon Cache"|@"重建图标缓存"|g' TrollStore/TSSettingsListController.m
        sed -i '' -e 's|@"Install Persistence Helper"|@"安装持久化助手"|g' -e 's|@"Uninstall Persistence Helper"|@"卸载持久化助手"|g' TrollStore/TSSettingsListController.m TrollHelper/TSHRootViewController.m
        sed -i '' -e 's|@"Install TrollStore"|@"安装巨魔商店"|g' -e 's|@"Uninstall TrollStore"|@"卸载巨魔商店"|g' TrollHelper/TSHRootViewController.m TrollStore/TSSettingsListController.m
        sed -i '' -e 's|@"Not Installed"|@"未安装"|g' -e 's|@"TrollStore Helper"|@"巨魔商店助手"|g' -e 's|@"Register Persistence Helper"|@"注册持久化助手"|g' -e 's|@"Unregister Persistence Helper"|@"取消注册持久化助手"|g' TrollHelper/TSHRootViewController.m
        sed -i '' -e 's|@"Installing TrollStore"|@"正在安装巨魔商店"|g' -e 's|@"Updating TrollStore"|@"正在更新巨魔商店"|g' Shared/TSListControllerShared.m
        sed -i '' -e 's|@"Install IPA File"|@"安装IPA文件"|g' -e 's|@"Install from URL"|@"从URL安装"|g' -e 's|@"Open with JIT"|@"用JIT打开"|g' -e 's|@"Show Details"|@"显示详情"|g' -e 's|@"Uninstall App"|@"卸载应用"|g' -e 's|@"Confirm Uninstallation"|@"确认卸载"|g' TrollStore/TSAppTableViewController.m
        sed -i '' -e 's|@"Force Installation"|@"强制安装"|g' -e 's|@"Installing ldid"|@"正在安装ldid"|g' TrollStore/TSInstallationController.m
        sed -i '' 's|https://github.com/opa334/TrollStore/releases/latest/download/TrollStore.tar|https://modelscope.cn/datasets/a27270401/ph/resolve/master/TrollStore.tar|g' Shared/TSListControllerShared.m

    - name: Build fastPathSign
      run: make -C Exploits/fastPathSign

    - name: Build RootHelper
      run: make -C RootHelper DEBUG=0

    - name: Build TrollStore.app
      run: make -C TrollStore FINALPACKAGE=1

    - name: Build PersistenceHelper
      run: |
        mkdir -p _build
        make -C TrollHelper clean
        make -C TrollHelper FINALPACKAGE=1 EMBEDDED_ROOT_HELPER=1
        cp TrollHelper/.theos/obj/TrollStorePersistenceHelper.app/TrollStorePersistenceHelper _build/PersistenceHelper_Embedded
        make -C TrollHelper clean
        make -C TrollHelper FINALPACKAGE=1 EMBEDDED_ROOT_HELPER=1 LEGACY_CT_BUG=1
        cp TrollHelper/.theos/obj/TrollStorePersistenceHelper.app/TrollStorePersistenceHelper _build/PersistenceHelper_Embedded_Legacy_arm64

    - name: Assemble TrollStore.tar
      run: |
        cp RootHelper/.theos/obj/trollstorehelper TrollStore/.theos/obj/TrollStore.app/trollstorehelper
        cp _build/PersistenceHelper_Embedded TrollStore/.theos/obj/TrollStore.app/PersistenceHelper
        export COPYFILE_DISABLE=1
        tar -czvf _build/TrollStore.tar -C TrollStore/.theos/obj TrollStore.app

    - name: Upload TrollStore.tar
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore.tar
        path: _build/TrollStore.tar
        retention-days: 90

    - name: Upload PersistenceHelper
      uses: actions/upload-artifact@v4
      with:
        name: PersistenceHelper_Embedded
        path: _build/PersistenceHelper_Embedded
        retention-days: 90
