name: TrollStore CN Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
    - name: Checkout TrollStore-cn (for localization script)
      uses: actions/checkout@v4

    - name: Save localize.py before checkout overwrites it
      run: cp localize.py /tmp/localize.py

    - name: Checkout opa334/TrollStore
      uses: actions/checkout@v4
      with:
        repository: opa334/TrollStore
        submodules: 'recursive'

    - name: Install deps + Setup Theos
      run: |
        brew install openssl@3 libarchive pkg-config ldid || true
        export THEOS=~/theos
        if [ ! -d "$THEOS/bin" ]; then
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
        fi
        mkdir -p "$THEOS/sdks"
        curl -sL "https://github.com/theos/sdks/archive/master.zip" -o /tmp/sdks.zip
        unzip -qo /tmp/sdks.zip -d /tmp
        cp -rn /tmp/sdks-master/*.sdk "$THEOS/sdks/" 2>/dev/null || true
        rm -rf /tmp/sdks-master /tmp/sdks.zip
        if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
          XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)
          [ -n "$XCODE_SDK" ] && [ -d "$XCODE_SDK" ] && ln -sfn "$XCODE_SDK" "$THEOS/sdks/iPhoneOS16.5.sdk"
        fi
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV

    - name: Chinese Localization
      run: python3 /tmp/localize.py

    - name: Verify localization (hex dump)
      run: |
        echo "=== TSRootViewController.m (after localization) ==="
        grep -c '应用' TrollStore/TSRootViewController.m && echo "Chinese FOUND!" || echo "NO Chinese!!"
        grep 'Apps' TrollStore/TSRootViewController.m | head -3
        echo "=== hex check first 20 lines ==="
        xxd TrollStore/TSRootViewController.m | head -20
        echo "=== file size ==="
        wc -c TrollStore/TSRootViewController.m

    - name: Build fastPathSign
      run: |
        make -C Exploits/fastPathSign clean
        make -C Exploits/fastPathSign

    - name: Build RootHelper
      run: |
        make -C RootHelper clean
        make -C RootHelper DEBUG=0

    - name: Build TrollStore.app
      run: |
        make -C TrollStore clean
        make -C TrollStore FINALPACKAGE=1

    - name: Build PersistenceHelper
      run: |
        mkdir -p _build
        make -C TrollHelper clean
        make -C TrollHelper FINALPACKAGE=1 EMBEDDED_ROOT_HELPER=1
        cp TrollHelper/.theos/obj/TrollStorePersistenceHelper.app/TrollStorePersistenceHelper _build/PersistenceHelper_Embedded

    - name: Download prebuilt ldid
      run: |
        curl -sL "https://github.com/opa334/TrollStore/releases/latest/download/PersistenceHelper_Embedded" -o /dev/null || true
        if [ ! -f /usr/local/bin/ldid ]; then
          curl -sL "https://github.com/opa334/TrollStore/releases/download/3.0/ldid" -o TrollStore/.theos/obj/TrollStore.app/ldid 2>/dev/null || true
        fi
        if [ -f /opt/homebrew/bin/ldid ]; then
          cp /opt/homebrew/bin/ldid TrollStore/.theos/obj/TrollStore.app/ldid
        elif [ -f /usr/local/bin/ldid ]; then
          cp /usr/local/bin/ldid TrollStore/.theos/obj/TrollStore.app/ldid
        fi
        echo "v2.1.5-procursus7-new" > TrollStore/.theos/obj/TrollStore.app/ldid.version
        chmod +x TrollStore/.theos/obj/TrollStore.app/ldid 2>/dev/null || true

    - name: Assemble TrollStore.tar
      run: |
        cp RootHelper/.theos/obj/trollstorehelper TrollStore/.theos/obj/TrollStore.app/trollstorehelper
        cp _build/PersistenceHelper_Embedded TrollStore/.theos/obj/TrollStore.app/PersistenceHelper
        export COPYFILE_DISABLE=1
        tar -czvf _build/TrollStore.tar -C TrollStore/.theos/obj TrollStore.app

    - name: Upload TrollStore.tar
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore.tar
        path: _build/TrollStore.tar
        retention-days: 90

    - name: Upload PersistenceHelper
      uses: actions/upload-artifact@v4
      with:
        name: PersistenceHelper_Embedded
        path: _build/PersistenceHelper_Embedded
        retention-days: 90
