name: TrollStore CN Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
    - name: Checkout opa334/TrollStore
      uses: actions/checkout@v4
      with:
        repository: opa334/TrollStore
        submodules: 'recursive'

    - name: Install deps + Setup Theos
      run: |
        brew install openssl@3 libarchive pkg-config ldid || true
        export THEOS=~/theos
        if [ ! -d "$THEOS/bin" ]; then
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
        fi
        mkdir -p "$THEOS/sdks"
        curl -sL "https://github.com/theos/sdks/archive/master.zip" -o /tmp/sdks.zip
        unzip -qo /tmp/sdks.zip -d /tmp
        cp -rn /tmp/sdks-master/*.sdk "$THEOS/sdks/" 2>/dev/null || true
        rm -rf /tmp/sdks-master /tmp/sdks.zip
        if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
          XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)
          [ -n "$XCODE_SDK" ] && [ -d "$XCODE_SDK" ] && ln -sfn "$XCODE_SDK" "$THEOS/sdks/iPhoneOS16.5.sdk"
        fi
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV

    - name: Chinese Localization
      run: |
        APP=$(printf 'åºç¨')
        SET=$(printf 'è®¾ç½®')
        INST=$(printf 'å®è£')
        UNINST=$(printf 'å¸è½½')
        USER=$(printf 'ç¨æ·')
        SYS=$(printf 'ç³»ç»')
        ERR=$(printf 'éè¯¯')
        WARN=$(printf 'è­¦å')
        SEC=$(printf 'å®å¨')
        ADV=$(printf 'é«çº§')
        INST_TS=$(printf 'å®è£å·¨é­ååº')
        UNINST_TS=$(printf 'å¸è½½å·¨é­ååº')
        HELPER=$(printf 'å·¨é­ååºå©æ')
        NOTINST=$(printf 'æªå®è£')
        INSTING=$(printf 'æ­£å¨å®è£å·¨é­ååº')
        UPDATING=$(printf 'æ­£å¨æ´æ°å·¨é­ååº')
        sed -i '' "s|@\"Apps\"|@\"$APP\"|g" TrollStore/TSRootViewController.m
        sed -i '' "s|@\"Settings\"|@\"$SET\"|g" TrollStore/TSRootViewController.m
        sed -i '' "s|@\"Install\"|@\"$INST\"|g" TrollStore/TSAppTableViewController.m
        sed -i '' "s|@\"Uninstall\"|@\"$UNINST\"|g" TrollStore/TSAppTableViewController.m
        sed -i '' "s|@\"User\"|@\"$USER\"|g" TrollStore/TSAppTableViewController.m
        sed -i '' "s|@\"System\"|@\"$SYS\"|g" TrollStore/TSAppTableViewController.m
        sed -i '' "s|@\"Error\"|@\"$ERR\"|g" TrollStore/TSAppTableViewController.m
        sed -i '' "s|@\"Warning\"|@\"$WARN\"|g" TrollStore/TSInstallationController.m
        sed -i '' "s|@\"Security\"|@\"$SEC\"|g" TrollStore/TSSettingsListController.m
        sed -i '' "s|@\"Advanced\"|@\"$ADV\"|g" TrollStore/TSSettingsListController.m
        sed -i '' "s|@\"Install TrollStore\"|@\"$INST_TS\"|g" TrollHelper/TSHRootViewController.m
        sed -i '' "s|@\"Uninstall TrollStore\"|@\"$UNINST_TS\"|g" TrollHelper/TSHRootViewController.m
        sed -i '' "s|@\"TrollStore Helper\"|@\"$HELPER\"|g" TrollHelper/TSHRootViewController.m
        sed -i '' "s|@\"Not Installed\"|@\"$NOTINST\"|g" TrollHelper/TSHRootViewController.m
        sed -i '' "s|@\"Installing TrollStore\"|@\"$INSTING\"|g" Shared/TSListControllerShared.m
        sed -i '' "s|@\"Updating TrollStore\"|@\"$UPDATING\"|g" Shared/TSListControllerShared.m
        sed -i '' "s|https://github.com/opa334/TrollStore/releases/latest/download/TrollStore.tar|https://modelscope.cn/datasets/a27270401/ph/resolve/master/TrollStore.tar|g" Shared/TSListControllerShared.m

    - name: Build fastPathSign
      run: make -C Exploits/fastPathSign

    - name: Build RootHelper
      run: make -C RootHelper DEBUG=0

    - name: Build TrollStore.app
      run: make -C TrollStore FINALPACKAGE=1

    - name: Build PersistenceHelper
      run: |
        mkdir -p _build
        make -C TrollHelper clean
        make -C TrollHelper FINALPACKAGE=1 EMBEDDED_ROOT_HELPER=1
        cp TrollHelper/.theos/obj/TrollStorePersistenceHelper.app/TrollStorePersistenceHelper _build/PersistenceHelper_Embedded

    - name: Assemble TrollStore.tar
      run: |
        cp RootHelper/.theos/obj/trollstorehelper TrollStore/.theos/obj/TrollStore.app/trollstorehelper
        cp _build/PersistenceHelper_Embedded TrollStore/.theos/obj/TrollStore.app/PersistenceHelper
        export COPYFILE_DISABLE=1
        tar -czvf _build/TrollStore.tar -C TrollStore/.theos/obj TrollStore.app

    - name: Upload TrollStore.tar
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore.tar
        path: _build/TrollStore.tar
        retention-days: 90

    - name: Upload PersistenceHelper
      uses: actions/upload-artifact@v4
      with:
        name: PersistenceHelper_Embedded
        path: _build/PersistenceHelper_Embedded
        retention-days: 90
