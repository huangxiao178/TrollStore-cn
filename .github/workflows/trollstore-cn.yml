name: TrollStore CN Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4

    - name: Setup Theos
      run: |
        export THEOS=/opt/theos
        sudo mkdir -p $THEOS
        sudo chown -R $(whoami):staff $(dirname $THEOS)
        git clone --depth 1 https://github.com/theos/theos.git $THEOS --recursive 2>/dev/null || true
        echo "=== SDK info ==="
        xcrun --sdk iphoneos --show-sdk-version
        xcrun --sdk iphoneos --show-sdk-path

    - name: Create SDK Stubs
      run: |
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        FW_DIR="$SDK_PATH/System/Library/PrivateFrameworks"
        for FW in Preferences MobileContainerManager SpringBoardServices BackBoardServices FrontBoardServices RunningBoardServices; do
          FW_PATH="$FW_DIR/$FW.framework"
          if [ -d "$FW_PATH" ]; then echo "OK $FW"; continue; fi
          echo "Creating stub $FW..."
          sudo mkdir -p "$FW_PATH"
          sudo touch "$FW_PATH/$FW"
        done

    - name: Check Source Mods
      run: |
        grep -n "modelscope" Shared/TSListControllerShared.m || echo "No modelscope ref"
        grep -n "github_fetchLatestVersion" Shared/TSUtil.m || echo "Version fetch check"

    - name: Configure SDK Target
      run: |
        SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)
        sed -i '' "s/TARGET := iphone:clang:.*/TARGET := iphone:clang:16.5:$SDK_VER/" Makefile
        head -3 Makefile

    - name: Build
      run: |
        export THEOS=/opt/theos
        export FINALPACKAGE=1
        make make_trollhelper_embedded EMBEDDED_ROOT_HELPER=1 2>&1 | tail -20
        make make_trollstore FINALPACKAGE=1 2>&1 | tail -20
        make assemble_trollstore 2>&1 | tail -10
        ls -la _build/

    - name: Upload PersistenceHelper
      uses: actions/upload-artifact@v4
      with:
        name: PersistenceHelper_Embedded
        path: _build/PersistenceHelper_Embedded

    - name: Upload TrollStore.tar
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore.tar
        path: _build/TrollStore.tar
