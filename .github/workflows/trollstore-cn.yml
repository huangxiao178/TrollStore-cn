name: TrollStore CN Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - 'build/**'
      - 'dist/**'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Theos
      run: |
        export THEOS=/opt/theos
        sudo mkdir -p $THEOS
        sudo chown -R $(whoami):staff $THEOS 2>/dev/null || true
        if [ ! -d "$THEOS/.git" ]; then
          sudo git clone --depth 1 https://github.com/theos/theos.git $THEOS
        fi
        echo "THEOS=$THEOS" >> $GITHUB_ENV

    - name: Generate TBD stubs
      run: |
        sudo python3 scripts/gen_tbd_stubs.py

    - name: Build RootHelper
      run: make -C RootHelper DEBUG=0

    - name: Build TrollHelper
      run: make -C TrollHelper EMBEDDED_ROOT_HELPER=1

    - name: Build TrollStore
      run: make -C TrollStore FINALPACKAGE=1

    - name: Assemble
      run: |
        mkdir -p _build
        cp RootHelper/.theos/obj/trollstorehelper TrollStore/.theos/obj/TrollStore.app/ 2>/dev/null || true
        cp TrollHelper/.theos/obj/TrollStorePersistenceHelper.app/TrollStorePersistenceHelper TrollStore/.theos/obj/TrollStore.app/PersistenceHelper 2>/dev/null || true
        COPYFILE_DISABLE=1 tar -czf _build/TrollStore.tar -C TrollStore/.theos/obj TrollStore.app
        ls -lh _build/

    - uses: actions/upload-artifact@v4
      with:
        name: TrollStore.tar
        path: _build/TrollStore.tar
