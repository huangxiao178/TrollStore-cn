name: Build CN (macOS13)

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Theos
      run: |
        export THEOS=/opt/theos
        sudo mkdir -p $THEOS
        sudo chown -R $(whoami):staff $(dirname $THEOS)
        git clone --depth 1 https://github.com/theos/theos.git $THEOS 2>/dev/null || (cd $THEOS && git pull)
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        PRIV_FW="$SDK_PATH/System/Library/PrivateFrameworks"
        for FW in Preferences MobileContainerManager SpringBoardServices BackBoardServices FrontBoardServices; do
          FW_DIR="$PRIV_FW/$FW.framework"
          [ -d "$FW_DIR" ] || { sudo mkdir -p "$FW_DIR"; sudo python3 -c "import os;f='$FW_DIR/$FW.tbd';fh=open(f,'w');fh.write('--- !tapi-tbd\n');fh.write('tbd-version: 4\n');fh.write('targets: [ arm64, arm64e ]\n');fh.write('uuids:\n  - target: arm64\n    value: 00000000-0000-0000-0000-000000000000\n  - target: arm64e\n    value: 00000000-0000-0000-0000-000000000000\n');fh.write('flags: [ flat_namespace, not_app_extension_safe ]\n');fh.write('install-name: /System/Library/PrivateFrameworks/$FW.framework/$FW\n');fh.write('current-version: 1\n');fh.write('compatibility-version: 1\n');fh.write('exports:\n  - archs: [ arm64, arm64e ]\n    symbols: [ _fake_symbol_for_linking ]\n');fh.close()"; sudo touch "$FW_DIR/$FW"; }
        done
    - name: Show Mods
      run: |
        grep -c "modelscope" Shared/TSListControllerShared.m || echo "0"
        grep -c "api.github" Shared/TSUtil.m || echo "0"
    - name: Build
      run: |
        export THEOS=/opt/theos
        make make_roothelper || exit 1
        make make_trollhelper_embedded EMBEDDED_ROOT_HELPER=1 || { find . -name errors -exec cat {} \; 2>/dev/null; exit 1; }
        make make_trollstore FINALPACKAGE=1 || exit 1
        make assemble_trollstore || { cp RootHelper/.theos/obj/trollstorehelper TrollStore/.theos/obj/TrollStore.app/ 2>/dev/null; cp TrollHelper/.theos/obj/TrollStorePersistenceHelper.app/TrollStorePersistenceHelper TrollStore/.theos/obj/TrollStore.app/PersistenceHelper 2>/dev/null; COPYFILE_DISABLE=1 tar -czf _build/TrollStore.tar -C TrollStore/.theos/obj TrollStore.app; }
        ls -lh _build/
    - name: Hashes
      run: |
        [ -f _build/PersistenceHelper_Embedded ] && shasum -a 256 _build/PersistenceHelper_Embedded
        [ -f _build/TrollStore.tar ] && shasum -a 256 _build/TrollStore.tar && ls -lh _build/TrollStore.tar
    - name: Upload PH
      uses: actions/upload-artifact@v4
      with:
        name: PersistenceHelper_Embedded
        path: _build/PersistenceHelper_Embedded
    - name: Upload Tar
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore.tar
        path: _build/TrollStore.tar
