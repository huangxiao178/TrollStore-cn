name: Build mobile installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build unsigned IPA
        env:
          CI: true
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: jumo-mobile-installer-unsigned
          path: TrollInstallerX.ipa
          if-no-files-found: error