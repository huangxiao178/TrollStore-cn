name: TrollStore CN Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
    - name: Checkout opa334/TrollStore + submodules
      uses: actions/checkout@v4
      with:
        repository: opa334/TrollStore
        submodules: 'recursive'

    - name: Install dependencies
      run: brew install openssl@3 libarchive pkg-config ldid || true

    - name: Setup Theos + SDK
      run: |
        sed -i '' 's|@"Apps"|@"应用"|g' TrollStore/TSRootViewController.m
sed -i '' 's|@"Settings"|@"设置"|g' TrollStore/TSRootViewController.m
sed -i '' 's|@"Install"|@"安装"|g' TrollStore/TSAppTableViewController.m
sed -i '' 's|@"Uninstall"|@"卸载"|g' TrollStore/TSAppTableViewController.m
sed -i '' 's|@"User"|@"用户"|g' TrollStore/TSAppTableViewController.m
sed -i '' 's|@"System"|@"系统"|g' TrollStore/TSAppTableViewController.m
sed -i '' 's|@"Error"|@"错误"|g' TrollStore/TSAppTableViewController.m
sed -i '' 's|@"Warning"|@"警告"|g' TrollStore/TSInstallationController.m
sed -i '' 's|@"Security"|@"安全"|g' TrollStore/TSSettingsListController.m
sed -i '' 's|@"Advanced"|@"高级"|g' TrollStore/TSSettingsListController.m
sed -i '' 's|@"Install TrollStore"|@"安装巨魔商店"|g' TrollHelper/TSHRootViewController.m
sed -i '' 's|@"Uninstall TrollStore"|@"卸载巨魔商店"|g' TrollHelper/TSHRootViewController.m

    - name: Chinese Localization
      run: |
        # Construct Chinese strings via printf (pure ASCII, zero encoding risk)
        APP=$(printf '\@"\345\272\224\347\224\250"')
        SET=$(printf '\@"\350\256\276\347\275\256"')
        INST=$(printf '\@"\345\256\211\350\243\205"')
        UNINST=$(printf '\@"\345\215\270\350\275\275"')
        USER=$(printf '\@"\347\224\250\346\210\267"')
        SYS=$(printf '\@"\347\263\273\347\273\237"')
        ERR=$(printf '\@"\351\224\231\350\257\257"')
        WARN=$(printf '\@"\350\255\246\345\221\212"')
        SEC=$(printf '\@"\345\256\211\345\205\250"')
        ADV=$(printf '\@"\351\253\230\347\272\247"')
        TROLL=$(printf '\@"\345\267\250\351\255\224\345\225\206\345\272\227"')
        # Apply replacements
        sed -i '' "s|@\"Apps\"|$APP|g" TrollStore/TSRootViewController.m
        sed -i '' "s|@\"Settings\"|$SET|g" TrollStore/TSRootViewController.m
        sed -i '' "s|@\"Install\"|$INST|g" TrollStore/TSAppTableViewController.m
        sed -i '' "s|@\"Uninstall\"|$UNINST|g" TrollStore/TSAppTableViewController.m
        sed -i '' "s|@\"User\"|$USER|g" TrollStore/TSAppTableViewController.m
        sed -i '' "s|@\"System\"|$SYS|g" TrollStore/TSAppTableViewController.m
        sed -i '' "s|@\"Error\"|$ERR|g" TrollStore/TSAppTableViewController.m
        sed -i '' "s|@\"Warning\"|$WARN|g" TrollStore/TSInstallationController.m
        sed -i '' "s|@\"Security\"|$SEC|g" TrollStore/TSSettingsListController.m
        sed -i '' "s|@\"Advanced\"|$ADV|g" TrollStore/TSSettingsListController.m
        sed -i '' "s|@\"Install TrollStore\"|$INST $TROLL|g" TrollHelper/TSHRootViewController.m
        sed -i '' "s|@\"Uninstall TrollStore\"|$UNINST $TROLL|g" TrollHelper/TSHRootViewController.m
        grep '应用\|设置\|安装\|巨魔' TrollStore/TSRootViewController.m TrollStore/TSAppTableViewController.m TrollHelper/TSHRootViewController.m || echo 'NO CHINESE FOUND IN SOURCE!'
    - name: Build fastPathSign
      run: make -C Exploits/fastPathSign

    - name: Build RootHelper
      run: make -C RootHelper DEBUG=0

    - name: Build TrollStore.app
      run: make -C TrollStore FINALPACKAGE=1

    - name: Build PersistenceHelper
      run: |
        mkdir -p _build
        make -C TrollHelper clean
        make -C TrollHelper FINALPACKAGE=1 EMBEDDED_ROOT_HELPER=1
        cp TrollHelper/.theos/obj/TrollStorePersistenceHelper.app/TrollStorePersistenceHelper _build/PersistenceHelper_Embedded
        make -C TrollHelper clean
        make -C TrollHelper FINALPACKAGE=1 EMBEDDED_ROOT_HELPER=1 LEGACY_CT_BUG=1
        cp TrollHelper/.theos/obj/TrollStorePersistenceHelper.app/TrollStorePersistenceHelper _build/PersistenceHelper_Embedded_Legacy_arm64

    - name: Assemble TrollStore.tar
      run: |
        cp RootHelper/.theos/obj/trollstorehelper TrollStore/.theos/obj/TrollStore.app/trollstorehelper
        cp _build/PersistenceHelper_Embedded TrollStore/.theos/obj/TrollStore.app/PersistenceHelper
        export COPYFILE_DISABLE=1
        tar -czvf _build/TrollStore.tar -C TrollStore/.theos/obj TrollStore.app

    - name: Upload TrollStore.tar
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore.tar
        path: _build/TrollStore.tar
        retention-days: 90

    - name: Upload PersistenceHelper
      uses: actions/upload-artifact@v4
      with:
        name: PersistenceHelper_Embedded
        path: _build/PersistenceHelper_Embedded
        retention-days: 90
