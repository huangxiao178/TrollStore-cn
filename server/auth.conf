server {
    listen 80;
    server_name jumo2.icu www.jumo2.icu 124.223.199.167;
    root /opt/auth;
    index index.php index.html;

    # Existing download/API limits.
    limit_req zone=dl burst=20 nodelay;
    limit_conn conn_per_ip 5;

    # Own kernelcache proxy. The app uses HTTP range requests while reading
    # the remote IPSW/OTA ZIP; this forwards those ranges to Apple's CDN.
    location ^~ /kernel-proxy/ {
        proxy_pass https://updates.cdn-apple.com/;
        proxy_ssl_server_name on;
        proxy_ssl_name updates.cdn-apple.com;
        proxy_set_header Host updates.cdn-apple.com;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Accept-Ranges bytes always;
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
