name: TrollStore CN Build
on:
  workflow_dispatch:
  push:
    branches: [master]
jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Setup Theos
      run: |
        export THEOS=$GITHUB_WORKSPACE/theos
        git clone --depth 1 https://github.com/theos/theos.git $THEOS 2>/dev/null || true
        cd $THEOS && git submodule update --init --recursive 2>/dev/null || true
        echo "THEOS=$THEOS" >> $GITHUB_ENV
    - name: Fix SDK version
      run: |
        SDK=$(xcrun --sdk iphoneos --show-sdk-version)
        grep -rl 'iphone:clang:16.5' . | xargs sed -i '' "s/iphone:clang:16.5:14.0/iphone:clang:$SDK:14.0/g"
    - name: Build RootHelper
      run: make -C RootHelper DEBUG=0 ADDITIONAL_CFLAGS="-Wno-error=deprecated-declarations"
    - name: Build TrollHelper
      run: make -C TrollHelper EMBEDDED_ROOT_HELPER=1 ADDITIONAL_CFLAGS="-Wno-error=deprecated-declarations"
    - name: Build TrollStore
      run: make -C TrollStore FINALPACKAGE=1 ADDITIONAL_CFLAGS="-Wno-error=deprecated-declarations"
    - name: Assemble
      run: |
        mkdir -p _build
        cp RootHelper/.theos/obj/trollstorehelper TrollStore/.theos/obj/TrollStore.app/ 2>/dev/null || true
        cp TrollHelper/.theos/obj/TrollStorePersistenceHelper.app/TrollStorePersistenceHelper TrollStore/.theos/obj/TrollStore.app/PersistenceHelper 2>/dev/null || true
        COPYFILE_DISABLE=1 tar -czf _build/TrollStore.tar -C TrollStore/.theos/obj TrollStore.app 2>/dev/null || true
        ls -lh _build/
    - uses: actions/upload-artifact@v4
      with:
        name: TrollStore.tar
        path: _build/TrollStore.tar
