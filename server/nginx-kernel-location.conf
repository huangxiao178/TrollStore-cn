# Add this location inside the existing `server { ... }` block.
# The prefix is stripped before proxying, so /kernel-proxy/foo becomes
# https://updates.cdn-apple.com/foo. Range headers are preserved for
# libgrabkernel2's partial ZIP reader.
location ^~ /kernel-proxy/ {
    proxy_pass https://updates.cdn-apple.com/;
    proxy_ssl_server_name on;
    proxy_ssl_name updates.cdn-apple.com;
    proxy_set_header Host updates.cdn-apple.com;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header Accept-Ranges bytes always;
}
