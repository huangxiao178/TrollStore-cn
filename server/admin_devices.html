<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设备管理 - 巨魔苹果玩家</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--line:#e6eaf1;--text:#1e2636;--muted:#7b879b;--brand:#6758dc;--brand-soft:#eeeaff;--green:#2d9c68;--green-soft:#e8f7ef;--red:#d8525f;--red-soft:#fff0f2;--shadow:0 10px 30px rgba(30,45,80,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Microsoft YaHei",Segoe UI,sans-serif}button,input{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 5%,#e6e3ff,transparent 38%),var(--bg)}.login-card{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:var(--shadow)}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#7669ed,var(--brand));color:#fff;display:grid;place-items:center;font-size:21px;font-weight:800;margin-bottom:18px}.login-card h1{margin:0 0 6px;font-size:23px}.login-card p{margin:0 0 24px;color:var(--muted)}.login-card label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:7px}.login-card input{width:100%;height:43px;border:1px solid #d8deea;border-radius:10px;padding:0 12px;outline:0}.login-card input:focus,.search:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(103,88,220,.12)}.login-card .btn{width:100%;margin-top:17px}.error{color:var(--red);min-height:20px;margin-top:10px;font-size:13px}
.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}.nav{width:min(1160px,calc(100% - 32px));height:48px;display:flex;align-items:center;gap:8px}.nav a{color:#5f6b80;text-decoration:none;padding:12px 20px;border-radius:11px}.nav a:hover,.nav a.active{color:var(--brand);background:var(--brand-soft);font-weight:800}.nav .spacer{flex:1}.logout{background:#f1f3f8;color:#647087;padding:9px 14px;border-radius:9px}
.wrap{width:min(1160px,calc(100% - 32px));margin:0 auto;padding:34px 0 50px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}.heading h1{font-size:27px;margin:0 0 5px}.heading p{margin:0;color:var(--muted)}.btn{height:40px;border-radius:10px;padding:0 17px;font-weight:800}.btn-primary{background:linear-gradient(135deg,#786cf0,var(--brand));color:#fff;box-shadow:0 7px 16px rgba(103,88,220,.2)}.btn-light{background:#f0f2f7;color:#59667c}.btn-freeze{background:var(--red-soft);color:var(--red);height:34px;padding:0 13px;border-radius:8px;font-size:12px;font-weight:800}.btn-unfreeze{background:var(--green-soft);color:var(--green);height:34px;padding:0 13px;border-radius:8px;font-size:12px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px 19px;box-shadow:var(--shadow)}.stat .label{color:var(--muted);font-size:12px;font-weight:700}.stat .num{font-size:28px;font-weight:800;margin-top:8px}.stat.green .num{color:var(--green)}.stat.red .num{color:var(--red)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.panel-head h2{font-size:16px;margin:0}.panel-head span{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:10px;margin-bottom:16px}.search{height:40px;flex:1;border:1px solid #d8deea;border-radius:10px;padding:0 13px;outline:0}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px}.table{width:100%;min-width:920px;border-collapse:collapse}.table th,.table td{text-align:left;white-space:nowrap;padding:13px;border-bottom:1px solid var(--line)}.table th{background:#fafbfe;color:#7c879b;font-size:12px}.table td{font-size:13px}.table tr:last-child td{border-bottom:0}.serial,.code{font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace;color:#4a4db5}.udid{max-width:185px;overflow:hidden;text-overflow:ellipsis;color:#68758a;font:11px ui-monospace,SFMono-Regular,Consolas,monospace}.badge{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800}.badge-active{background:var(--green-soft);color:var(--green)}.badge-frozen{background:#fff1e8;color:#b66a27}.empty{padding:46px;text-align:center;color:var(--muted)}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:15px;color:var(--muted);font-size:12px}.pager button{height:32px;background:#f0f2f7;color:#59667c;border-radius:8px;padding:0 12px}.pager button:disabled{opacity:.45;cursor:not-allowed}.note{margin-top:13px;color:var(--muted);font-size:12px}
@media(max-width:680px){.topbar{height:auto;padding:10px 0}.nav{height:auto;flex-wrap:wrap}.nav a{padding:9px 12px}.nav .spacer{display:none}.wrap{width:min(100% - 22px,1160px);padding-top:24px}.heading{align-items:flex-start;flex-direction:column}.stats{gap:9px}.stat{padding:13px}.stat .num{font-size:23px}.panel{padding:14px}}
</style>
</head>
<body>
<div id="login" class="login hidden"><div class="login-card"><div class="logo">巨</div><h1>设备管理</h1><p>巨魔苹果玩家 · 管理员登录</p><label for="password">管理密码</label><input id="password" type="password" autocomplete="current-password" placeholder="请输入管理密码"><button class="btn btn-primary" onclick="login()">进入后台</button><div id="loginError" class="error"></div></div></div>
<div id="app" class="hidden">
  <header class="topbar"><nav class="nav"><a href="/admin_cards.html">制卡</a><a href="/admin_cards.html">卡密记录</a><a class="active" href="/admin_devices.html">设备管理</a><span class="spacer"></span><button class="logout" onclick="logout()">退出登录</button></nav></header>
  <main class="wrap">
    <div class="heading"><div><h1>使用我卡密的设备</h1><p>查看绑定设备的型号、系统版本和最近活跃时间</p></div><button class="btn btn-light" onclick="refresh()">刷新数据</button></div>
    <div class="stats"><div class="stat"><div class="label">绑定设备</div><div class="num" id="total">—</div></div><div class="stat green"><div class="label">正常设备</div><div class="num" id="active">—</div></div><div class="stat red"><div class="label">已冻结设备</div><div class="num" id="frozen">—</div></div></div>
    <section class="panel"><div class="panel-head"><h2>设备列表</h2><span>冻结只阻止巨魔操作，不删除手机上的应用或数据</span></div><div class="toolbar"><input id="search" class="search" placeholder="搜索序列号 / UDID / 型号 / 卡密" onkeydown="if(event.key==='Enter')load(1)"><button class="btn btn-primary" onclick="load(1)">查询</button></div><div class="table-wrap"><table class="table"><thead><tr><th>序列号</th><th>UDID</th><th>型号</th><th>iOS</th><th>卡密</th><th>状态</th><th>最后活跃</th><th>操作</th></tr></thead><tbody id="rows"><tr><td colspan="8" class="empty">正在加载…</td></tr></tbody></table></div><div class="pager"><span id="pageInfo">—</span><div><button id="prev" onclick="change(-1)">上一页</button> <button id="next" onclick="change(1)">下一页</button></div></div><div class="note">状态由设备端 TrollStore 定期回报；设备离线时后台显示最后一次回报时间。</div></section>
  </main>
</div>
<script>
var API='/api/admin_devices_api.php',AUTH='/api/admin_api.php',csrf='',page=1,totalPages=1;
function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;',"\"":'&quot;'}[c]})}
async function json(url,opts){var r=await fetch(url,opts||{}),d={};try{d=await r.json()}catch(e){throw Error('服务器返回格式错误')}if(r.status===401)throw Error('请先登录后台');if(!d.ok)throw Error(d.msg||'操作失败');return d}
async function authMe(){try{var d=await json(AUTH+'?action=me');csrf=d.csrf;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await refresh()}catch(e){document.getElementById('login').classList.remove('hidden');document.getElementById('app').classList.add('hidden')}}
async function login(){var p=document.getElementById('password').value,e=document.getElementById('loginError');if(!p){e.textContent='请输入管理密码';return}e.textContent='';try{var body=new URLSearchParams();body.set('password',p);var d=await json(AUTH+'?action=login',{method:'POST',credentials:'same-origin',body:body});csrf=d.csrf;document.getElementById('password').value='';document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await refresh()}catch(x){e.textContent=x.message}}
async function logout(){try{await fetch(AUTH+'?action=logout',{method:'POST',credentials:'same-origin'})}catch(e){}location.reload()}
async function refresh(){try{var d=await json(API+'?action=summary',{credentials:'same-origin'});document.getElementById('total').textContent=d.summary.total;document.getElementById('active').textContent=d.summary.active;document.getElementById('frozen').textContent=d.summary.frozen;await load(page)}catch(e){if(e.message==='请先登录后台')authMe();else alert(e.message)}}
async function load(p){page=p||1;var body=new URLSearchParams();body.set('page',page);body.set('page_size',20);body.set('search',document.getElementById('search').value.trim());var target=document.getElementById('rows');target.innerHTML='<tr><td colspan="8" class="empty">正在加载…</td></tr>';try{var d=await json(API+'?action=list',{method:'POST',credentials:'same-origin',body:body});var rs=d.rows||[];totalPages=Math.max(1,Math.ceil(d.total/d.page_size));if(!rs.length){target.innerHTML='<tr><td colspan="8" class="empty">没有找到已绑定设备</td></tr>'}else{target.innerHTML=rs.map(function(r,i){var frozen=String(r.status)==='2';var action=frozen?'<button class="btn-unfreeze" onclick="changeStatus(\''+esc(r.code)+'\',\'unfreeze\')">解除冻结</button>':'<button class="btn-freeze" onclick="changeStatus(\''+esc(r.code)+'\',\'freeze\')">冻结</button>';return '<tr><td class="serial">'+((page-1)*d.page_size+i+1)+'</td><td class="udid" title="'+esc(r.udid)+'">'+esc(r.udid)+'</td><td>'+esc(r.device_model||'未知')+'</td><td>'+esc(r.ios_version||r.ts_version||'未知')+'</td><td class="code">'+esc(r.code)+'</td><td><span class="badge '+(frozen?'badge-frozen':'badge-active')+'">'+(frozen?'已冻结':'正常')+'</span></td><td>'+esc(r.last_active||'—')+'</td><td>'+action+'</td></tr>'}).join('')}document.getElementById('pageInfo').textContent='第 '+page+' / '+totalPages+' 页 · 共 '+d.total+' 台';document.getElementById('prev').disabled=page<=1;document.getElementById('next').disabled=page>=totalPages}catch(e){target.innerHTML='<tr><td colspan="8" class="empty">'+esc(e.message)+'</td></tr>'}}
function change(delta){var p=page+delta;if(p>=1&&p<=totalPages)load(p)}
async function changeStatus(code,operation){if(!confirm(operation==='freeze'?'确认冻结这台设备吗？':'确认解除这台设备的冻结吗？'))return;var body=new URLSearchParams();body.set('code',code);body.set('operation',operation);try{await json(API+'?action=status',{method:'POST',credentials:'same-origin',headers:{'X-CSRF-Token':csrf},body:body});await refresh()}catch(e){alert(e.message)}}
authMe();
</script>
</body></html>
