# TrollStore CN Build
# PersistenceHelper + TrollStore.tar from same source
# Mods: modelscope CDN, Chinese resources, disabled GitHub version check

name: Build TrollStore CN

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Theos
      run: |
        export THEOS=/opt/theos
        sudo mkdir -p $THEOS
        sudo chown -R $(whoami):staff $(dirname $THEOS)
        
        git clone --depth 1 https://github.com/theos/theos.git $THEOS 2>/dev/null || (cd $THEOS && git pull)
        
        echo "=== SDK Info ==="
        xcrun --sdk iphoneos --show-sdk-path
        xcrun --sdk iphoneos --show-sdk-version
        
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        PRIV_DIR="$SDK_PATH/System/Library/PrivateFrameworks"
        
        if [ -d "$PRIV_DIR/Preferences.framework" ]; then
          echo "✓ Preferences.framework exists"
        else
          echo "✗ Missing private frameworks in SDK"
        fi

    - name: Create Framework Stubs
      run: |
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        PRIV_FW="$SDK_PATH/System/Library/PrivateFrameworks"
        
        for FW in Preferences MobileContainerManager SpringBoardServices BackBoardServices FrontBoardServices; do
          FW_DIR="$PRIV_FW/$FW.framework"
          [ -d "$FW_DIR" ] && { echo "✓ $FW"; continue; }
          
          echo "Creating $FW stub..."
          sudo mkdir -p "$FW_DIR"
          
          python3 -c "
import os
f='$FW_DIR/$FW.tbd'
with open(f,'w') as fh:
    fh.write('--- !tapi-tbd\n')
    fh.write('tbd-version: 4\n')
    fh.write('targets: [ arm64, arm64e ]\n')
    fh.write('uuids:\n')
    fh.write('  - target: arm64\n')
    fh.write('    value: 00000000-0000-0000-0000-000000000000\n')
    fh.write('  - target: arm64e\n')
    fh.write('    value: 00000000-0000-0000-0000-000000000000\n')
    fh.write('flags: [ flat_namespace, not_app_extension_safe ]\n')
    fh.write('install-name: /System/Library/PrivateFrameworks/STUB.framework/STUB\n')
    fh.write('current-version: 1\n')
    fh.write('compatibility-version: 1\n')
    fh.write('exports:\n')
    fh.write('  - archs: [ arm64, arm64e ]\n')
    fh.write('    symbols: [ _fake_symbol_for_linking ]\n')
"
          # Fix the install-name for this specific framework
          sudo sed -i '' "s|STUB.framework|$FW.framework|g" "$FW_DIR/$FW.tbd"
          sudo sed -i '' "s|/STUB$|/$FW|g" "$FW_DIR/$FW.tbd"
          
          sudo touch "$FW_DIR/$FW"
        done
        
        echo "=== Private Frameworks ==="
        ls "$PRIV_FW/" | head -20

    - name: Show Source Mod Status
      run: |
        echo "=== Download URL ==="
        grep -c "modelscope\|TrollStore.tar" Shared/TSListControllerShared.m
        grep -c "github" Shared/TSListControllerShared.m
        echo "=== Version API ==="
        grep -c "api.github\|opa334" Shared/TSUtil.m || echo "0"

    - name: Build
      run: |
        export THEOS=/opt/theos
        
        echo ">>> Building RootHelper..."
        make make_roothelper || { echo "RootHelper FAILED"; exit 1; }
        
        echo ">>> Building PersistenceHelper (embedded)..."
        make make_trollhelper_embedded EMBEDDED_ROOT_HELPER=1 || { echo "PH FAILED"; find . -name errors -exec cat {} \; 2>/dev/null; exit 1; }
        
        echo ">>> Building TrollStore app..."
        make make_trollstore FINALPACKAGE=1 || { echo "TrollStore FAILED"; exit 1; }
        
        echo ">>> Assembling TrollStore.tar..."
        make assemble_trollstore || {
          echo "Assembly via make failed, manual assembly..."
          cp RootHelper/.theos/obj/trollstorehelper TrollStore/.theos/obj/TrollStore.app/ 2>/dev/null
          cp TrollHelper/.theos/obj/TrollStorePersistenceHelper.app/TrollStorePersistenceHelper TrollStore/.theos/obj/TrollStore.app/PersistenceHelper 2>/dev/null
          COPYFILE_DISABLE=1 tar -czf _build/TrollStore.tar -C TrollStore/.theos/obj TrollStore.app
        }
        
        echo "=== Outputs ==="
        ls -lh _build/

    - name: Show Hashes
      run: |
        [ -f _build/PersistenceHelper_Embedded ] && shasum -a 256 _build/PersistenceHelper_Embedded
        [ -f _build/TrollStore.tar ] && shasum -a 256 _build/TrollStore.tar
        [ -f _build/PersistenceHelper_Embedded ] && file _build/PersistenceHelper_Embedded
        [ -f _build/TrollStore.tar ] && ls -lh _build/TrollStore.tar

    - name: Upload PersistenceHelper
      uses: actions/upload-artifact@v4
      with:
        name: PersistenceHelper_Embedded
        path: _build/PersistenceHelper_Embedded

    - name: Upload TrollStore.tar
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore.tar
        path: _build/TrollStore.tar
